openapi: 3.0.3
info:
  title: Frutti Del Mare ERP API
  version: 1.0.0
paths:
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfCookie
      description: Sets the CSRF cookie. The apps call it once before the first POST
        (D-008).
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '401':
          description: Wrong username or password
        '403':
          description: The account has no active role in an organization
        '429':
          description: Too many attempts
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/batches:
    get:
      operationId: listBatches
      description: |-
        Batches, newest receipt first, paginated (`limit`, `offset`). Filter by product or supplier;
        `search` matches the batch number, the supplier's receipt reference, product and supplier.
        Batches are created by goods receipts, not here.
      parameters:
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: product
        schema:
          type: integer
          minimum: 1
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: supplier
        schema:
          type: integer
          minimum: 1
      tags:
      - batches
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBatchList'
          description: ''
  /api/v1/batches/{batch_id}:
    get:
      operationId: getBatch
      parameters:
      - in: path
        name: batch_id
        schema:
          type: integer
        required: true
      tags:
      - batches
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
          description: ''
  /api/v1/batches/{batch_id}/sales:
    get:
      operationId: getBatchSales
      description: |-
        What one lot sold over its confirmed sales: kg, revenue without VAT, cost of the goods and margin,
        then each sale line that took from it (oldest first). Office data: drivers get 403.
      parameters:
      - in: path
        name: batch_id
        schema:
          type: integer
        required: true
      tags:
      - batches
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSales'
          description: ''
  /api/v1/boxes/adjustments:
    post:
      operationId: adjustBoxes
      description: |-
        Boxes bought (they come into a cold room or a truck) or lost or broken (they leave it, with the
        reason). Owners and managers; a mistake is corrected by a new adjustment.
      tags:
      - boxes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoxAdjustmentWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BoxAdjustmentWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BoxAdjustmentWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoxMovement'
          description: ''
  /api/v1/boxes/balances:
    get:
      operationId: listBoxBalances
      description: |-
        How many boxes each holder has, per box type: locations, clients and suppliers that have moved
        boxes. A supplier's count is what we owe it (boxes it lent us).
      tags:
      - boxes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoxBalance'
          description: ''
  /api/v1/boxes/movements:
    get:
      operationId: listBoxMovements
      description: |-
        The box history, newest first, paginated (`limit`, `offset`). Filter by one holder (either side
        of the movement) and by box type.
      parameters:
      - in: query
        name: box_type
        schema:
          enum:
          - small
          - big
          type: string
          minLength: 1
        description: |-
          * `small` - Petite caisse
          * `big` - Grande caisse
      - in: query
        name: holder
        schema:
          type: integer
          minimum: 1
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      tags:
      - boxes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBoxMovementList'
          description: ''
  /api/v1/categories:
    get:
      operationId: listCategories
      tags:
      - categories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
    post:
      operationId: createCategory
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Category'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/categories/{category_id}:
    patch:
      operationId: renameCategory
      parameters:
      - in: path
        name: category_id
        schema:
          type: integer
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/cold-room-costs:
    get:
      operationId: getColdRoomMonth
      description: |-
        One month of cold-room costs: the bill if any, and per room its weight and cost for the month
        and per day, estimated (the estimate typed for the month, else the previous month's daily rate) until the
        bill is approved; the estimate and the difference with the real bill come with it.
      parameters:
      - in: query
        name: month
        schema:
          type: string
          format: date
      tags:
      - cold-room-costs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColdRoomMonth'
          description: ''
  /api/v1/cold-room-estimate:
    put:
      operationId: updateColdRoomEstimate
      description: |-
        Type the electricity estimate of a month for all the cold rooms (owner or manager), until the month's
        bill is approved: the rooms share it by weight, as the bill is shared (D-227).
      tags:
      - cold-room-estimate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColdRoomEstimateWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ColdRoomEstimateWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ColdRoomEstimateWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColdRoomMonth'
          description: ''
  /api/v1/cold-room-shares:
    put:
      operationId: updateColdRoomShares
      description: |-
        Set every active cold room's share of the electricity bill in %, adding up to 100 (owner only):
        used by the bills approved from now on.
      tags:
      - cold-room-shares
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColdRoomSharesWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ColdRoomSharesWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ColdRoomSharesWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ColdRoomWeight'
          description: ''
  /api/v1/cold-room-weights:
    get:
      operationId: listColdRoomWeights
      description: |-
        The active cold rooms with their weight in the split of the electricity bill (equal, 1, unless
        the owner set another) and the share it gives.
      tags:
      - cold-room-weights
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ColdRoomWeight'
          description: ''
  /api/v1/cold-room-weights/{location_id}:
    put:
      operationId: updateColdRoomWeight
      description: 'Set a cold room''s weight (owner only): used by the bills approved
        from now on.'
      parameters:
      - in: path
        name: location_id
        schema:
          type: integer
        required: true
      tags:
      - cold-room-weights
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColdRoomWeightWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ColdRoomWeightWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ColdRoomWeightWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ColdRoomWeight'
          description: ''
  /api/v1/counts:
    get:
      operationId: listCounts
      description: Stock counts, newest first, paginated, each with its sheet. Filter
        by status or location.
      parameters:
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: location
        schema:
          type: integer
          minimum: 1
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          enum:
          - counting
          - approved
          - cancelled
          type: string
          minLength: 1
        description: |-
          * `counting` - En cours
          * `approved` - Validé
          * `cancelled` - Annulé
      tags:
      - counts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCountList'
          description: ''
    post:
      operationId: startCount
      description: |-
        Open a count sheet for a location: one line per batch it holds, with the kg the ledger expects.
        One count at a time per location.
      tags:
      - counts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CountWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CountWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'
          description: ''
  /api/v1/counts/{count_id}:
    get:
      operationId: getCount
      parameters:
      - in: path
        name: count_id
        schema:
          type: integer
        required: true
      tags:
      - counts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'
          description: ''
  /api/v1/counts/{count_id}/approve:
    post:
      operationId: approveCount
      description: Post a count correction for every difference and freeze the count.
        Every line must be counted.
      parameters:
      - in: path
        name: count_id
        schema:
          type: integer
        required: true
      tags:
      - counts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'
          description: ''
  /api/v1/counts/{count_id}/cancel:
    post:
      operationId: cancelCount
      description: 'Give up an open count: nothing moved.'
      parameters:
      - in: path
        name: count_id
        schema:
          type: integer
        required: true
      tags:
      - counts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'
          description: ''
  /api/v1/counts/{count_id}/lines:
    put:
      operationId: recordCounted
      description: |-
        Type the kg counted on lines of an open sheet (empty clears, 0 = nothing found). Errors come
        back on `lines.<index>.counted_quantity`.
      parameters:
      - in: path
        name: count_id
        schema:
          type: integer
        required: true
      tags:
      - counts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Counted'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Counted'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Counted'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'
          description: ''
  /api/v1/credit-notes:
    get:
      operationId: listCreditNotes
      description: |-
        Credit notes, newest first, paginated, with their invoice and lines. Filter by customer, days or
        `search` (number, invoice number, customer).
      parameters:
      - in: query
        name: customer
        schema:
          type: integer
          minimum: 1
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      tags:
      - credit-notes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCreditNoteList'
          description: ''
  /api/v1/credit-notes/{credit_note_id}:
    get:
      operationId: getCreditNote
      description: One credit note with its invoice and lines.
      parameters:
      - in: path
        name: credit_note_id
        schema:
          type: integer
        required: true
      tags:
      - credit-notes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNote'
          description: ''
  /api/v1/customer-effets/{instrument_id}/unpaid:
    post:
      operationId: recordUnpaidEffet
      description: |-
        The bank refused this customer cheque or traite (owner or manager): it becomes "Impayé", the customer
        owes its amount again (the sales its règlement settled owe again beyond its credit), the bank's charges
        become an expense "Frais financiers" and the office is told (D-217). Answers with the règlement.
      parameters:
      - in: path
        name: instrument_id
        schema:
          type: integer
        required: true
      tags:
      - customer-effets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnpaidWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UnpaidWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UnpaidWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPaymentDetail'
          description: ''
  /api/v1/customer-payments:
    get:
      operationId: listCustomerPayments
      description: |-
        Customer payments, newest first, paginated, voided ones included. Filter by customer, days
        received (inclusive), means (`mixed`: several), state (`active`, `voided`, `unallocated`) or `search`
        (number, reference, cheque or traite number, customer).
      parameters:
      - in: query
        name: customer
        schema:
          type: integer
          minimum: 1
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: method
        schema:
          enum:
          - cash
          - cheque
          - bill
          - transfer
          - card
          - mixed
          type: string
          minLength: 1
        description: |-
          * `cash` - Espèces
          * `cheque` - Chèque
          * `bill` - Traite
          * `transfer` - Virement
          * `card` - Carte bancaire
          * `mixed` - Plusieurs moyens
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: state
        schema:
          enum:
          - active
          - voided
          - unallocated
          type: string
          minLength: 1
        description: |-
          * `active` - active
          * `voided` - voided
          * `unallocated` - unallocated
      tags:
      - customer-payments
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomerPaymentList'
          description: ''
    post:
      operationId: createCustomerPayment
      description: |-
        Register a règlement received from a customer (owner or manager). `lines` gives its means (cash,
        cheques, traites with number, bank and échéance, transfer, card); without it, `amount` and `method` make
        its one line. `allocations` empty or absent settles their oldest open sales first; a list names the sales
        or invoices and amounts (an empty list keeps everything as credit). Errors of a row come back on
        `lines.<index>.<field>` and `allocations.<index>.amount`.
      tags:
      - customer-payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPaymentWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerPaymentWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerPaymentWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPaymentDetail'
          description: ''
  /api/v1/customer-payments/{payment_id}:
    get:
      operationId: getCustomerPayment
      description: One payment with its means (each effet with its history) and the
        sales it settled.
      parameters:
      - in: path
        name: payment_id
        schema:
          type: integer
        required: true
      tags:
      - customer-payments
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPaymentDetail'
          description: ''
  /api/v1/customer-payments/{payment_id}/allocate:
    post:
      operationId: allocateCustomerPayment
      description: |-
        Settle sales with what is left of a payment: the named sales and amounts, or (without
        `allocations`) the customer's oldest open sales first.
      parameters:
      - in: path
        name: payment_id
        schema:
          type: integer
        required: true
      tags:
      - customer-payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocateWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AllocateWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AllocateWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPaymentDetail'
          description: ''
  /api/v1/customer-payments/{payment_id}/void:
    post:
      operationId: voidCustomerPayment
      description: |-
        Cancel a payment typed by mistake (a reason is required): it stays, marked voided, and the sales
        it settled owe again.
      parameters:
      - in: path
        name: payment_id
        schema:
          type: integer
        required: true
      tags:
      - customer-payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VoidWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VoidWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPaymentDetail'
          description: ''
  /api/v1/customer-payments/export:
    get:
      operationId: exportCustomerPayments
      description: The règlements of the same filters as the list, as an Excel file
        (one row each, voided ones marked).
      parameters:
      - in: query
        name: customer
        schema:
          type: integer
          minimum: 1
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: method
        schema:
          enum:
          - cash
          - cheque
          - bill
          - transfer
          - card
          - mixed
          type: string
          minLength: 1
        description: |-
          * `cash` - Espèces
          * `cheque` - Chèque
          * `bill` - Traite
          * `transfer` - Virement
          * `card` - Carte bancaire
          * `mixed` - Plusieurs moyens
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: state
        schema:
          enum:
          - active
          - voided
          - unallocated
          type: string
          minLength: 1
        description: |-
          * `active` - active
