        owner only: a manager gets 403. Saving again for the same day replaces that day's version.
      tags:
      - finance-settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceSettingsWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FinanceSettingsWrite'
