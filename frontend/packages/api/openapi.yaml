  /api/v1/quotes:
    get:
      operationId: listQuotes
      description: |-
        Quotes, newest first, paginated (`limit`, `offset`). Filter by status (a sent quote past its
        validity date counts as expired), customer, days (inclusive) or `search` (number, customer).
      parameters:
      - in: query
        name: customer
        schema:
          type: integer
          minimum: 1
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - draft
          - sent
          - accepted
          - refused
          - expired
          type: string
          minLength: 1
        description: |-
          * `draft` - Brouillon
          * `sent` - Envoyé
          * `accepted` - Accepté
          * `refused` - Refusé
          * `expired` - Expiré
      tags:
      - quotes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuoteList'
          description: ''
    post:
      operationId: createQuote
      description: |-
        Prepare a quote (a draft), or with `send_now` mark it sent at once. A line without `unit_price`
        takes the sale price in force on the quote's day; without `valid_until` it is valid 3 days.
        Errors of a line come back on `lines.<index>.<field>`.
      tags:
      - quotes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuoteWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuoteWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDetail'
          description: ''
  /api/v1/quotes/{quote_id}:
    get:
      operationId: getQuote
      description: One quote with its lines and totals (without VAT until P2-T05).
      parameters:
      - in: path
        name: quote_id
        schema:
          type: integer
        required: true
      tags:
      - quotes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDetail'
          description: ''
    put:
      operationId: updateQuote
      description: |-
        Change a draft (every line is replaced), and with `send_now` send it too. A sent quote no longer
        changes.
      parameters:
      - in: path
        name: quote_id
        schema:
          type: integer
        required: true
      tags:
      - quotes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuoteWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuoteWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDetail'
          description: ''
  /api/v1/quotes/{quote_id}/accept:
    post:
      operationId: acceptQuote
      description: |-
        Record the customer's yes on a sent quote, up to its validity date included. No stock is
        reserved; the sale comes from it in P2-T04.
      parameters:
      - in: path
        name: quote_id
        schema:
          type: integer
        required: true
      tags:
      - quotes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDetail'
          description: ''
  /api/v1/quotes/{quote_id}/convert:
    post:
      operationId: convertQuoteToSale
      description: |-
        Turn an accepted quote, still valid, into a sale (a draft, or confirmed with `confirm_now`): same
        customer, products, prices and discounts, from the quote's place unless `location` is given. Without
        `lines` it takes every kilo not on a BL yet; with `lines`, the kg given per quote line, at most what is
        left (a quote may be delivered in several BL, D-115). The quote stays accepted and links to its sales.
      parameters:
      - in: path
        name: quote_id
        schema:
          type: integer
        required: true
      tags:
      - quotes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteConvert'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuoteConvert'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuoteConvert'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDetail'
          description: ''
  /api/v1/quotes/{quote_id}/refuse:
    post:
      operationId: refuseQuote
      description: Record the customer's no on a sent quote, with an optional reason.
      parameters:
      - in: path
        name: quote_id
        schema:
          type: integer
        required: true
      tags:
      - quotes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRefuse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuoteRefuse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuoteRefuse'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDetail'
          description: ''
  /api/v1/quotes/{quote_id}/send:
    post:
      operationId: sendQuote
      description: |-
        Mark a draft as given to the customer: it no longer changes. Refused once its validity date has
        passed.
      parameters:
      - in: path
        name: quote_id
        schema:
          type: integer
        required: true
      tags:
      - quotes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDetail'
          description: ''
  /api/v1/receipts:
    get:
      operationId: listReceipts
      description: |-
        Goods receipts, newest first, paginated (`limit`, `offset`), each with its lines and totals.
        Filter by supplier, by `search` (number, supplier's reference, supplier name) or to receipts with
        a weight difference.
      parameters:
      - in: query
        name: differences
        schema:
          type: boolean
          default: false
      - name: limit
