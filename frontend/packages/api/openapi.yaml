            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoadPayment'
          description: ''
    post:
      operationId: collectMyPayment
      description: |-
        Record money a customer handed over today. It settles their oldest open sales first, and counts in
