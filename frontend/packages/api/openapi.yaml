  /api/v1/partners/{partner_id}/balances:
    get:
      operationId: getPartnerBalances
      description: |-
        A partner's three balances, kept apart: what is owed for goods (trade payable), their capital
        still in lots, and their profit share (owed to them, or by them).
      parameters:
      - in: path
        name: partner_id
        schema:
          type: integer
        required: true
      tags:
      - partners
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerBalances'
          description: ''
  /api/v1/partnerships:
    get:
      operationId: listPartnerships
      description: |-
        Partnership lots, newest first, paginated (`limit`, `offset`), each with the partner's capital
        now. Cancelled ones only when asked for by `status`. Filter by partner, lot, or `search`.
      parameters:
      - in: query
        name: batch
        schema:
          type: integer
          minimum: 1
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: partner
        schema:
          type: integer
          minimum: 1
      - in: query
        name: search
        schema:
          type: string
          default: ''
      - in: query
        name: status
        schema:
          enum:
          - open
          - closed
          - settled
          - cancelled
          type: string
          minLength: 1
        description: |-
          * `open` - En cours
          * `closed` - Clôturé
          * `settled` - Réglé
          * `cancelled` - Annulé
      tags:
      - partnerships
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLotPartnershipList'
          description: ''
    post:
      operationId: createPartnership
      description: |-
        Put a lot in partnership with one supplier (owner only): at receipt or on an open lot before its
        first sale. One partner per lot; the partner's capital opens their capital ledger in this lot.
      tags:
      - partnerships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LotPartnershipWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LotPartnershipWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LotPartnershipWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotPartnershipDetail'
          description: ''
