        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EffetReject'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EffetReject'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EffetReject'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierPaymentDetail'
          description: ''
  /api/v1/supplier-invoices:
    get:
      operationId: listSupplierInvoices
      description: |-
        Supplier invoices, newest first, paginated, each with its receipts, payments, paid amount and what
        is still owed. Filter by supplier, status (`open` = posted and not fully paid), overdue, or `search`
        (our number, the supplier's invoice number, the supplier's name).
      parameters:
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: overdue
