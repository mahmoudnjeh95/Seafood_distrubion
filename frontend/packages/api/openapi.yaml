      operationId: getLotCosts
      description: |-
        The costs charged to one lot so far: expenses typed on it and its share of the truck costs of
        each day it was on a truck (by kg loaded). `total` counts approved lines only; drafts and waiting
        expenses are listed for information.
      parameters:
      - in: query
        name: batch
        schema:
          type: integer
          minimum: 1
        required: true
      tags:
      - lot-costs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotCosts'
          description: ''
  /api/v1/lot-figures:
    get:
      operationId: listLotFigures
      description: |-
        The frozen figures (sales, costs, net result, partner share) of the closed lots among `batch_ids`.
        An open lot has no row: its result is live and read lot by lot.
      parameters:
      - in: query
        name: batch_ids
        schema:
          type: string
        description: Lot ids, comma-separated (at most 200).
      tags:
      - lot-figures
      security:
      - cookieAuth: []
      responses:
        '200':
