  /api/v1/my-customers:
    get:
      operationId: listMyCustomers
      description: |-
        Active customers for a driver to sell to (name and city only, never what they owe: D-207): the ones
        they sold to lately first, the walk-in customer last. Filter with `search`. At most 30 rows. When today's
        load of the driver's truck names clients, only those clients and the walk-in customer are listed (D-174).
      parameters:
      - in: query
        name: kind
        schema:
          enum:
          - restaurant
          - hotel
          - fish_shop
          - supermarket
          - wholesaler
          - caterer
          - individual
          type: string
          minLength: 1
        description: |-
          * `restaurant` - Restaurant
          * `hotel` - Hôtel
          * `fish_shop` - Poissonnerie
          * `supermarket` - Supermarché
          * `wholesaler` - Grossiste
          * `caterer` - Traiteur
          * `individual` - Particulier
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - active
          - archived
          - all
          type: string
          default: active
          minLength: 1
        description: |-
          * `active` - active
          * `archived` - archived
          * `all` - all
      tags:
      - my-customers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerChoice'
          description: ''
    post:
      operationId: createMyCustomer
      description: |-
        A driver adds a customer they sell to, with a name and optionally a phone and a city. Its credit limit
        is zero, cash only, until the office sets one. A name an active customer already has is refused.
      tags:
      - my-customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyCustomerWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MyCustomerWrite'
          multipart/form-data:
