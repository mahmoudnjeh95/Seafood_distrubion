      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadExpense'
          description: ''
  /api/v1/my-field-purchases:
    get:
      operationId: listMyFieldPurchases
      description: The driver's own purchases of the last 30 days, newest first, with
        what the office decided and its note.
      tags:
      - my-field-purchases
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyFieldPurchase'
          description: ''
    post:
      operationId: sendMyFieldPurchase
      description: |-
        Send what was bought at the port: the supplier (or a new name), the products (or new names), kg, price,
        the deal and the money given. It waits for the office; nothing enters stock and nothing is owed before.
        `client_uuid` makes a retry answer with the purchase already saved; `made_at` is the phone's time.
      tags:
      - my-field-purchases
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyFieldPurchaseCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MyFieldPurchaseCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MyFieldPurchaseCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyFieldPurchase'
          description: ''
  /api/v1/my-field-purchases/{purchase_id}:
    put:
      operationId: changeMyFieldPurchase
      description: |-
        Change a purchase the office has not decided yet (a new revision). What the office set stays: the kg
        received, the place, the boxes, its note. `revision` must be the current one, else 400 on `revision`.
      parameters:
      - in: path
        name: purchase_id
        schema:
          type: integer
        required: true
      tags:
      - my-field-purchases
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyFieldPurchaseUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MyFieldPurchaseUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MyFieldPurchaseUpdate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyFieldPurchase'
          description: ''
  /api/v1/my-field-purchases/{purchase_id}/paper:
    put:
      operationId: addMyFieldPurchasePaper
      description: |-
        Join the photo of the supplier's paper to one of the driver's purchases (D-159): turned upright, shrunk,
        stored as WebP without the phone's metadata. Replaced while the office has not decided the purchase.
      parameters:
      - in: path
        name: purchase_id
        schema:
          type: integer
        required: true
      tags:
      - my-field-purchases
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FieldPurchasePaper'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyFieldPurchase'
          description: ''
  /api/v1/my-losses:
    post:
      operationId: reportMyLoss
      description: |-
        Report kilos lost on the driver's truck today, with a photo. Small losses leave the stock at once;
        a heavy one waits for the owner.
      tags:
      - my-losses
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoadLossWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadLoss'
          description: ''
  /api/v1/my-payments:
