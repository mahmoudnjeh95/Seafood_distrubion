      - in: path
        name: invoice_id
        schema:
          type: integer
        required: true
      tags:
      - supplier-invoices
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierInvoice'
          description: ''
  /api/v1/supplier-payments:
    get:
      operationId: listSupplierPayments
      description: |-
        Payments to suppliers, newest first, paginated (voided ones too), with their means, the invoices each
        one settled and the part not allocated yet. Filter by supplier, days paid, means (`mixed`: several),
        state (`active`, `voided`, `unallocated`) or `search` (number, cheque or transfer reference, supplier).
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: limit
