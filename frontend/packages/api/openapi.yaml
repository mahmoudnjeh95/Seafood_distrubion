  /api/v1/treasury/movements-of:
    get:
      operationId: listMovementsOf
      description: |-
        The treasury movements written by the given records of one source, each with the account it went through
        (a règlement's lines, a sale, an expense, a partner's payout). Empty for a record with no money.
      parameters:
      - in: query
        name: from_source
        schema:
          type: string
          maxLength: 40
          minLength: 1
        required: true
      - in: query
        name: source_ids
        schema:
          type: string
          maxLength: 2000
          minLength: 1
        required: true
      tags:
      - treasury
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MovementOf'
          description: ''
  /api/v1/treasury/party-documents:
    get:
      operationId: listPartyDocuments
      description: |-
        What each customer and supplier has on paper, for the lists of the règlement forms (D-211): a customer's
        confirmed BL and issued invoices with their net to pay, a supplier's goods receipts (BR) and invoices (not
        drafts) with their total. A party with no such document is not listed.
      tags:
      - treasury
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyDocuments'
          description: ''
  /api/v1/treasury/statement-lines/{line_id}:
    put:
      operationId: setStatementLineParty
      description: |-
        Say whose line it is (owner or manager): a customer for a line at the debit, a supplier for one at the
        credit. Both left empty clears it.
      parameters:
      - in: path
        name: line_id
        schema:
          type: integer
        required: true
      tags:
      - treasury
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatementLineParty'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StatementLineParty'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StatementLineParty'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankStatementLine'
          description: ''
    delete:
      operationId: deleteStatementLine
      description: 'Take a line off the statement (owner or manager): a wrong import.
        It was only a copy of the bank''s file.'
      parameters:
      - in: path
        name: line_id
        schema:
          type: integer
        required: true
      tags:
      - treasury
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/treasury/transfers:
    get:
      operationId: listAccountTransfers
      description: |-
        Versements, retraits and virements between our accounts, newest first, paginated; `account` keeps those
        of one account.
      parameters:
      - in: query
        name: account
        schema:
          type: integer
          minimum: 1
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      tags:
      - treasury
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountTransferList'
          description: ''
    post:
      operationId: createAccountTransfer
      description: |-
        Move money between two of our accounts on a day (owner or manager): a versement (cash to the bank), a
        retrait (bank to cash) or a virement. One movement out, one in.
      tags:
      - treasury
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountTransferWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountTransferWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountTransferWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTransfer'
          description: ''
  /api/v1/treasury/transfers/{transfer_id}/void:
    post:
      operationId: voidAccountTransfer
      description: 'Cancel a transfer typed by mistake (owner or manager, with a reason):
        two opposite movements today.'
      parameters:
      - in: path
        name: transfer_id
        schema:
          type: integer
        required: true
      tags:
      - treasury
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidTransfer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VoidTransfer'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VoidTransfer'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTransfer'
          description: ''
  /api/v1/truck-assignments:
    get:
      operationId: listTruckAssignments
      description: Who drives which truck on a day (today by default). A driver sees
        only their own assignment.
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
      tags:
      - truck-assignments
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TruckAssignment'
          description: ''
    post:
      operationId: assignTruck
      description: |-
        Give a truck to a driver for a day. A driver can only take a truck for themselves; they may
        change their own mind, the office must remove the first assignment before giving another truck.
      tags:
      - truck-assignments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TruckAssignmentWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TruckAssignmentWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TruckAssignmentWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TruckAssignment'
          description: ''
  /api/v1/truck-assignments/{assignment_id}:
    delete:
      operationId: unassignTruck
      description: 'Take an assignment back: the truck falls back to its usual driver
        for that day.'
      parameters:
      - in: path
        name: assignment_id
        schema:
          type: integer
        required: true
      tags:
      - truck-assignments
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/trucks:
    get:
      operationId: listTrucks
      description: Trucks sorted by name, with their driver. A driver sees only their
        own truck.
      parameters:
      - in: query
        name: status
        schema:
          enum:
          - active
          - archived
          - all
          type: string
          default: active
          minLength: 1
        description: |-
          * `active` - active
          * `archived` - archived
          * `all` - all
      tags:
      - trucks
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Truck'
          description: ''
    post:
      operationId: createTruck
      description: A new truck, with the stock location that holds its goods.
      tags:
      - trucks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TruckWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TruckWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TruckWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Truck'
          description: ''
  /api/v1/trucks/{truck_id}:
    get:
      operationId: getTruck
      parameters:
      - in: path
        name: truck_id
        schema:
          type: integer
        required: true
      tags:
      - trucks
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Truck'
          description: ''
    patch:
      operationId: updateTruck
      description: 'Rename a truck, change its plate or its driver (`driver: null`
        takes it back from its driver).'
      parameters:
      - in: path
        name: truck_id
        schema:
          type: integer
        required: true
      tags:
      - trucks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTruckWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTruckWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTruckWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Truck'
          description: ''
  /api/v1/trucks/{truck_id}/archive:
    post:
      operationId: archiveTruck
      description: An archived truck keeps its history, receives no more stock and
        has no driver.
      parameters:
      - in: path
        name: truck_id
        schema:
          type: integer
        required: true
      tags:
      - trucks
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Truck'
          description: ''
  /api/v1/trucks/{truck_id}/restore:
    post:
      operationId: restoreTruck
      parameters:
      - in: path
        name: truck_id
        schema:
          type: integer
        required: true
      tags:
      - trucks
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Truck'
          description: ''
  /api/v1/vat-products:
    get:
      operationId: listVatProducts
      description: 'The ids of the products with kilos in stock bought with VAT: the
        quote and sale forms flag them (D-202).'
      tags:
      - vat-products
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VatProducts'
          description: ''
  /api/v1/web-requests:
    get:
      operationId: listWebRequests
      description: |-
        Quote requests and orders sent from the public site, newest first, paginated (`limit`, `offset`).
        Filter by status, kind or `search` (name, phone, company, number).
      parameters:
      - in: query
        name: kind
        schema:
          enum:
          - quote
          - order
          type: string
          minLength: 1
        description: |-
          * `quote` - Demande de devis
          * `order` - Commande
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          default: ''
      - in: query
        name: status
        schema:
          enum:
          - new
          - handled
          - cancelled
          type: string
          minLength: 1
        description: |-
          * `new` - Nouvelle
          * `handled` - Traitée
          * `cancelled` - Annulée
      tags:
      - web-requests
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWebRequestList'
          description: ''
  /api/v1/web-requests/{request_id}:
    get:
      operationId: getWebRequest
      parameters:
      - in: path
        name: request_id
        schema:
          type: integer
        required: true
      tags:
      - web-requests
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebRequest'
          description: ''
  /api/v1/web-requests/{request_id}/status:
    post:
      operationId: setWebRequestStatus
      description: 'The office called the visitor back: mark the request handled or
        cancelled with a note, or new again.'
      parameters:
      - in: path
        name: request_id
        schema:
          type: integer
        required: true
      tags:
      - web-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebRequestStatus'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WebRequestStatus'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WebRequestStatus'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebRequest'
          description: ''
  /api/v1/withholding-certificates/{certificate_id}/file:
    put:
      operationId: addWithholdingCertificateFile
      description: |-
        Join the certificate's file: a photo (turned upright, shrunk, stored as WebP) or a PDF. Replaces
        an earlier file of a live certificate.
      parameters:
      - in: path
        name: certificate_id
        schema:
          type: integer
        required: true
      tags:
      - withholding-certificates
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WithholdingFile'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithholdingCertificate'
          description: ''
        '400':
          description: Not a photo or a PDF
  /api/v1/withholding-certificates/{certificate_id}/void:
    post:
      operationId: voidWithholdingCertificate
      description: |-
        Cancel a certificate typed by mistake (a reason is required): the invoice's planned withholding
        counts again.
      parameters:
      - in: path
        name: certificate_id
        schema:
          type: integer
        required: true
      tags:
      - withholding-certificates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VoidWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VoidWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithholdingCertificate'
          description: ''
  /api/v1/withholding-summary:
    get:
      operationId: getWithholdingSummary
      description: |-
        For the accountant: what customers withheld over a period (certificate dates, both ends
        included): total, per month, per customer, each certificate, and the issued invoices that planned a
        withholding but have no certificate yet.
      parameters:
      - in: query
        name: customer
        schema:
          type: integer
          minimum: 1
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      tags:
      - withholding-summary
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithholdingSummary'
          description: ''
components:
  schemas:
    AccountKindEnum:
      enum:
      - cash
      - bank
      - driver
      type: string
      description: |-
        * `cash` - Caisse
        * `bank` - Compte bancaire
        * `driver` - Caisse chauffeur
    AccountRef:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/AccountKindEnum'
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - kind
      - name
    AccountStatement:
      type: object
      properties:
        account:
          allOf:
          - $ref: '#/components/schemas/TreasuryAccount'
          readOnly: true
        date_from:
          type: string
          format: date
          readOnly: true
          nullable: true
        date_to:
          type: string
          format: date
          readOnly: true
          nullable: true
        opening:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        total_in:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        total_out:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        closing:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        rows:
          type: array
          items:
            $ref: '#/components/schemas/MovementRow'
          readOnly: true
      required:
      - account
      - closing
      - date_from
      - date_to
      - opening
      - rows
      - total_in
      - total_out
    AccountTransfer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/AccountTransferKindEnum'
          readOnly: true
        from_account:
          allOf:
          - $ref: '#/components/schemas/AccountRef'
          readOnly: true
        to_account:
          allOf:
          - $ref: '#/components/schemas/AccountRef'
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        transferred_on:
          type: string
          format: date
          readOnly: true
        reference:
          type: string
          readOnly: true
        notes:
          type: string
          readOnly: true
        created_by:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_voided:
          type: boolean
          readOnly: true
        voided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        voided_by:
          type: string
          readOnly: true
        void_reason:
          type: string
          readOnly: true
      required:
      - amount
      - created_at
      - created_by
      - from_account
      - id
      - is_voided
      - kind
      - notes
      - number
      - reference
      - to_account
      - transferred_on
      - void_reason
      - voided_at
      - voided_by
    AccountTransferKindEnum:
      enum:
      - cash_deposit
      - withdrawal
      - transfer
      type: string
      description: |-
        * `cash_deposit` - Versement espèces
        * `withdrawal` - Retrait
        * `transfer` - Virement entre comptes
    AccountTransferWrite:
      type: object
      properties:
        from_account:
          type: integer
          minimum: 1
          nullable: true
        to_account:
          type: integer
          minimum: 1
          nullable: true
        amount:
          type: string
          maxLength: 30
        transferred_on:
          type: string
          format: date
          nullable: true
        reference:
          type: string
          default: ''
          maxLength: 50
        notes:
          type: string
          default: ''
          maxLength: 255
      required:
      - amount
    AdjustmentWrite:
      type: object
      properties:
        amount:
          type: string
        reason:
          type: string
          maxLength: 200
      required:
      - amount
      - reason
    AgeBuckets:
      type: object
      properties:
        d0_30:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        d31_60:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        d60_plus:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
      required:
      - d0_30
      - d31_60
      - d60_plus
    AgeingRow:
      type: object
      properties:
        customer:
          allOf:
          - $ref: '#/components/schemas/QuoteCustomer'
          readOnly: true
        credit_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        overdue:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        ageing:
          allOf:
          - $ref: '#/components/schemas/AgeBuckets'
          readOnly: true
      required:
      - ageing
      - balance
      - credit
      - credit_limit
      - customer
      - overdue
    AllocateWrite:
      type: object
      properties:
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/CustomerAllocationWrite'
          nullable: true
    AllocationWrite:
      type: object
      properties:
        invoice:
          type: integer
          minimum: 1
        amount:
          type: string
      required:
      - amount
      - invoice
    ApprovedMonth:
      type: object
      properties:
        month:
          type: string
          format: date
          readOnly: true
        approved:
          type: integer
          readOnly: true
      required:
      - approved
      - month
    AwaitingInvoice:
      type: object
      description: An issued invoice that planned a withholding and has no certificate
        yet.
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          readOnly: true
        issued_on:
          type: string
          format: date
          readOnly: true
        withholding_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        customer:
          allOf:
          - $ref: '#/components/schemas/QuoteCustomer'
          readOnly: true
      required:
      - customer
      - id
      - issued_on
      - number
      - withholding_amount
    BalanceWriteOff:
      type: object
      properties:
        expected_amount:
          type: string
          maxLength: 30
        reason:
          type: string
          maxLength: 255
      required:
      - expected_amount
      - reason
    Bank:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        swift:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - address
      - code
      - id
      - is_active
      - name
      - swift
    BankStatementLine:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        day:
          type: string
          format: date
          readOnly: true
        label:
          type: string
          readOnly: true
        debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        credit:
          type: string
