          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FieldPurchaseWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FieldPurchaseWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldPurchase'
          description: ''
  /api/v1/field-purchases/{purchase_id}/refuse:
    post:
