          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoadPaymentWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoadPaymentWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadPayment'
          description: ''
  /api/v1/my-purchase-costs:
