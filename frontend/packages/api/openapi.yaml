        schema:
          type: integer
      - in: query
        name: method
        schema:
          enum:
          - cash
          - cheque
          - transfer
          - bill
          - other
          - mixed
          type: string
          minLength: 1
        description: |-
          * `cash` - Espèces
          * `cheque` - Chèque
          * `transfer` - Virement
          * `bill` - Traite
          * `other` - Autre
          * `mixed` - Plusieurs moyens
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: state
        schema:
          enum:
          - active
          - voided
          - unallocated
          type: string
          minLength: 1
        description: |-
          * `active` - active
          * `voided` - voided
          * `unallocated` - unallocated
      - in: query
        name: supplier
        schema:
          type: integer
          minimum: 1
      - in: query
        name: unallocated
        schema:
          type: boolean
          default: false
      tags:
      - supplier-payments
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSupplierPaymentList'
          description: ''
    post:
      operationId: recordSupplierPayment
      description: |-
        Record money paid to a supplier and the posted invoices it settles. Its means come in `lines` (some
        cash, our cheques and traites, each one an effet the treasury follows), or as one means in `amount`,
        `method`, `reference` and `cash_on`. What is not allocated is an advance, to allocate later;
        `auto_allocate` pays the invoices due first. Errors come back on `lines.<index>.<field>`,
        `allocations.<index>.<field>` and `plan_lines.<index>`.
      tags:
      - supplier-payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierPaymentWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupplierPaymentWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SupplierPaymentWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierPayment'
          description: ''
  /api/v1/supplier-payments/{payment_id}:
