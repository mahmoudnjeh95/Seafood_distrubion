  /api/v1/sales:
    get:
      operationId: listSales
      description: |-
        Sales, newest first, paginated (`limit`, `offset`). Filter by status, customer, place, days of the
        sale (inclusive) or `search` (number, customer). A driver sees only their own sales, without costs.
      parameters:
      - in: query
        name: customer
        schema:
          type: integer
          minimum: 1
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: delivery_status
        schema:
          enum:
          - to_deliver
          - delivered
          - partial
          - cancelled
          type: string
          minLength: 1
        description: |-
          * `to_deliver` - À livrer
          * `delivered` - Livré
          * `partial` - Livré en partie
          * `cancelled` - Non livré
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: location
        schema:
          type: integer
          minimum: 1
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - draft
          - confirmed
          - cancelled
          type: string
          minLength: 1
        description: |-
          * `draft` - Brouillon
          * `confirmed` - Confirmée
          * `cancelled` - Annulée
      - in: query
        name: uninvoiced
        schema:
          type: boolean
          default: false
      tags:
      - sales
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSaleList'
          description: ''
    post:
      operationId: createSale
      description: |-
        Type a sale (a draft), or with `confirm_now` confirm it at once: the stock leaves oldest batch first
        and the customer owes what is not paid. Without `customer` it is the walk-in customer (counter sale,
        who pays everything). A line without `unit_price` takes the customer's price in force at `sold_at`.
        Errors of a line come back on `lines.<index>.<field>`. A driver sells only from their truck of the
        day. A driver's phone sends in `sold_at` when the sale was made: the sale takes that date and that
        day's price, also when it was kept without connection and sent later. Within 5 minutes of the
        server's clock the server's own time is used; further in the future is refused (400), as is a day the
        office has approved or a truck the driver did not have that day (403), and stock the truck has not
        held since that day (400).
      tags:
      - sales
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaleWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaleWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDetail'
          description: ''
  /api/v1/sales/{sale_id}:
    get:
      operationId: getSale
      description: |-
        One sale with its lines and, once confirmed, the lots each line came from with their cost (not
        shown to drivers). Totals are without VAT until P2-T05.
      parameters:
      - in: path
        name: sale_id
        schema:
          type: integer
        required: true
      tags:
      - sales
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDetail'
          description: ''
    put:
      operationId: updateSale
      description: |-
        Change a draft (every line is replaced), and with `confirm_now` confirm it too. A confirmed sale no
        longer changes: cancel it instead.
      parameters:
      - in: path
        name: sale_id
        schema:
          type: integer
        required: true
      tags:
      - sales
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaleWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaleWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDetail'
          description: ''
  /api/v1/sales/{sale_id}/cancel:
    post:
      operationId: cancelSale
      description: |-
        Cancel a sale (owner or manager). A confirmed sale needs a reason: its kilos come back to the same
        lots at the same place; the sale stays, marked cancelled.
      parameters:
      - in: path
        name: sale_id
        schema:
          type: integer
        required: true
      tags:
      - sales
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleCancel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaleCancel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaleCancel'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDetail'
          description: ''
  /api/v1/sales/{sale_id}/confirm:
    post:
      operationId: confirmSale
      description: |-
        Confirm a draft: the stock leaves oldest batch first and the customer owes what is not paid. Refused
        as a whole when the place holds too little (`lines.<index>.quantity`) or, under the company's "block"
        policy, when the customer would go above their credit limit (`credit_limit`). Under the "approval"
        policy the sale stays a draft with `credit_status` pending until the owner or a manager confirms it
        with `approve_credit`.
      parameters:
      - in: path
        name: sale_id
        schema:
          type: integer
        required: true
      tags:
      - sales
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaleConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaleConfirm'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDetail'
          description: ''
  /api/v1/site-products:
    get:
      operationId: listSiteProducts
