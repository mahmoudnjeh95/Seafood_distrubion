            schema:
              $ref: '#/components/schemas/CloseLot'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotResultView'
          description: ''
  /api/v1/lots/{batch_id}/late-adjustments:
    post:
      operationId: bookLateAdjustments
      description: |-
        Carry the costs recorded after the lot closed to the partner's balance now (owner only), without
        reopening the lot. Settling does it too; this makes the amount visible on the partner's balance.
      parameters:
      - in: path
        name: batch_id
        schema:
          type: integer
        required: true
      tags:
      - lots
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotSettlementView'
          description: ''
  /api/v1/lots/{batch_id}/reopen:
    post:
      operationId: reopenLot
      description: Reopen a closed lot (owner only, reason required, audited). The
        frozen result stays as history.
      parameters:
      - in: path
        name: batch_id
        schema:
          type: integer
        required: true
      tags:
      - lots
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReopenLot'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReopenLot'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReopenLot'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotResultView'
          description: ''
  /api/v1/lots/{batch_id}/result:
    get:
      operationId: getLotResult
      description: |-
        The result of one lot with every step: revenue, purchase cost of the kg sold, kg written off,
        each kind of cost, net result, and on a partnership lot the partner's share, the loss share taken
        from their capital and the capital to give back. Live ("so far") on an open lot, frozen on a
        closed one, with what closing the lot needs.
      parameters:
      - in: path
        name: batch_id
        schema:
          type: integer
        required: true
      tags:
      - lots
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotResultView'
          description: ''
  /api/v1/lots/{batch_id}/settle:
    post:
      operationId: settleLot
      description: |-
        Settle a closed partnership lot with its partner (owner only): pay their capital back and their
        profit share. The payments must add up to the amount shown by `getLotSettlement`.
      parameters:
      - in: path
        name: batch_id
        schema:
          type: integer
        required: true
      tags:
      - lots
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettleLot'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SettleLot'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SettleLot'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotSettlementView'
          description: ''
  /api/v1/lots/{batch_id}/settlement:
    get:
      operationId: getLotSettlement
      description: |-
        The lot's settlement with its partner: what settling would pay (capital back ± share, minus what
        the partner owes from earlier lots), or what was paid; the late costs waiting for the next
        settlement; and the partner's three balances (trade payable, capital, profit share).
