          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WithholdingCertificateWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WithholdingCertificateWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithholdingCertificate'
          description: ''
