      description: |-
        The account's movements between two days (inclusive), oldest first, each with the balance after it; the
        balance at the start and the end, the money in and out. `kind` and `search` narrow the rows shown.
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
