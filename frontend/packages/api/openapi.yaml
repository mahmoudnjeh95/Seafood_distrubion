                $ref: '#/components/schemas/ImportReport'
          description: ''
        '400':
          description: Not a readable template
  /api/v1/invoices:
    get:
      operationId: listInvoices
      description: |-
        Invoices, drafts first then the newest issued, paginated (`limit`, `offset`). Filter by status,
        customer, sale, issue days (inclusive) or `search` (number, sale number, customer). Office roles read.
      parameters:
      - in: query
        name: customer
        schema:
          type: integer
          minimum: 1
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: sale
        schema:
          type: integer
          minimum: 1
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - draft
          - issued
          - cancelled
          type: string
          minLength: 1
        description: |-
          * `draft` - Brouillon
          * `issued` - Émise
          * `cancelled` - Annulée par avoir
      tags:
      - invoices
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvoiceList'
          description: ''
    post:
      operationId: createInvoice
      description: |-
        Prepare the invoice of a confirmed sale (a draft without number), or with `issue_now` issue it at
        once. VAT, stamp and withholding are proposed from the finance settings and each product's own rate;
        `apply_vat` false makes an invoice without VAT (empty: with VAT only for goods bought with VAT, D-246), and
        every typed value is flagged and audited. Errors:
        `lines.<index>.vat_rate`, `vat_amounts.<rate>`, `fiscal_stamp`, `fees`, `withholding_rate`.
      tags:
      - invoices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvoiceCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvoiceCreate'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
          description: ''
  /api/v1/invoices/{invoice_id}:
    get:
      operationId: getInvoice
      description: |-
        One invoice as printed: seller, customer, lines, VAT per rate, stamp, totals, withholding and its
        credit notes. A draft shows the values the settings propose beside the typed ones.
      parameters:
      - in: path
        name: invoice_id
        schema:
          type: integer
        required: true
      tags:
      - invoices
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
          description: ''
    put:
      operationId: updateInvoice
      description: |-
        Change a draft (every value given again; empty takes the settings), and with `issue_now` issue it.
        An issued invoice never changes: make a credit note.
      parameters:
      - in: path
        name: invoice_id
        schema:
          type: integer
        required: true
      tags:
      - invoices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceChoices'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvoiceChoices'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvoiceChoices'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
          description: ''
    delete:
      operationId: deleteInvoice
      description: Throw a draft away (it has no number yet). An issued invoice is
        never deleted.
      parameters:
      - in: path
        name: invoice_id
        schema:
          type: integer
        required: true
      tags:
      - invoices
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/invoices/{invoice_id}/credit-notes:
    post:
      operationId: createCreditNote
      description: |-
        Correct an issued invoice with a credit note (AV-2026-0001...), the only correction. `full` gives back
        everything left and cancels the invoice; `partial` gives back, per line, kilos (`quantity`) or an
        amount without VAT (`amount`), with the line's VAT. `stock` says what happens to the kilos given back:
        `none` (nothing moves), `restock` (back in the sale's place, on the batches they left) or `loss`
        (back, then written off on the same lot). Errors: `lines.<index>.<field>`, `reason`, `stock`.
      parameters:
      - in: path
        name: invoice_id
        schema:
          type: integer
        required: true
      tags:
      - invoices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditNoteWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreditNoteWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreditNoteWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNote'
          description: ''
  /api/v1/invoices/{invoice_id}/issue:
    post:
      operationId: issueInvoice
      description: |-
        Issue a draft: the next number of the year (FA-2026-0001...), today's date, the settings in force now
        for what was not typed, seller and customer copied. From then on it never changes. Nothing is sent to
        TTN / El Fatoora (D-016).
      parameters:
      - in: path
        name: invoice_id
        schema:
          type: integer
        required: true
      tags:
      - invoices
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
          description: ''
  /api/v1/invoices/{invoice_id}/withholding-certificate:
    post:
      operationId: recordWithholdingCertificate
      description: |-
        Record what the customer withheld on an issued invoice with its certificate's number, date and
        amount (owner or manager). The amount replaces the planned withholding in the receivable. The file
        is joined with `addWithholdingCertificateFile`.
      parameters:
      - in: path
        name: invoice_id
        schema:
          type: integer
        required: true
      tags:
      - invoices
      requestBody:
        content:
          application/json:
