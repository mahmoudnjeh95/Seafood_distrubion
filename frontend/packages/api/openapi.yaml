          * `effet_unpaid` - Effet impayé
          * `effet_debited` - Effet débité
          * `transfer` - Mouvement entre comptes
          * `count_gap` - Écart de caisse
          * `sale_cash` - Vente au comptant
          * `driver_handover` - Remise du chauffeur
          * `driver_fund` - Fonds remis au chauffeur
          * `expense` - Dépense
          * `salary` - Salaire
