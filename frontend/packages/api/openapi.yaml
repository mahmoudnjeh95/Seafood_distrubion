  /api/v1/my-deliveries:
    get:
      operationId: listMyDeliveries
      description: |-
        The BL prepared for the driver's truck with its load, still to deliver, oldest first, each with its
        client, address, products and boxes. Delivering one (`deliverMyDelivery`) is the sale (D-160, D-178).
      tags:
      - my-deliveries
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SaleDetail'
          description: ''
  /api/v1/my-deliveries/{sale_id}/deliver:
    post:
      operationId: deliverMyDelivery
      description: |-
        Deliver a BL of the load: send only the lines that changed (`lines`: kg delivered, zero takes the
        product off), the boxes left and what the client paid. Only the kg delivered leave the truck and are owed;
        the rest stays on the truck. Nothing delivered is "not delivered". Errors of a line come back on
        `lines.<index>.<field>`.
      parameters:
      - in: path
        name: sale_id
        schema:
          type: integer
        required: true
      tags:
      - my-deliveries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Deliver'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Deliver'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Deliver'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDetail'
          description: ''
  /api/v1/my-deliveries/{sale_id}/not-delivered:
    post:
      operationId: notDeliveredMyDelivery
      description: |-
        The BL is not delivered (refused, closed): nothing is sold, the goods and boxes stay on the truck and go
        back to the cold room with the return. The note is optional.
      parameters:
      - in: path
        name: sale_id
        schema:
          type: integer
        required: true
      tags:
      - my-deliveries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotDelivered'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NotDelivered'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotDelivered'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDetail'
          description: ''
  /api/v1/my-expense-categories:
    get:
      operationId: listRoadCategories
      description: 'The few categories a driver can spend on from the road: fuel,
        transport, handling, other.'
      tags:
      - my-expense-categories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
