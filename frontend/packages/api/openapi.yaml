        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: tone
        schema:
          enum:
          - draft
          - waiting
          - done
          - cancelled
          type: string
          minLength: 1
        description: |-
          * `draft` - draft
          * `waiting` - waiting
          * `done` - done
          * `cancelled` - cancelled
      - in: query
        name: types
        schema:
          type: string
          default: ''
          maxLength: 50
      tags:
      - document-index
