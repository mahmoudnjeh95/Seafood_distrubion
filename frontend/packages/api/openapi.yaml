        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/documents/{kind}/{object_id}/pdf:
    get:
      operationId: getDocumentPdf
      description: |-
        The PDF of a quote (`quote`), invoice (`invoice`), credit note (`credit_note`) or customer payment
        receipt (`receipt`). 200 is the file; 202 `pending` means it is being made (ask again in a second);
        500 `failed` means the last attempt failed (`?retry=1` tries again). Office data: drivers get 403.
      parameters:
      - in: path
        name: kind
        schema:
          type: string
        required: true
      - in: path
        name: object_id
        schema:
          type: integer
        required: true
      - in: query
        name: retry
        schema:
          type: boolean
        description: Try again after a failure.
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdfState'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdfState'
          description: ''
