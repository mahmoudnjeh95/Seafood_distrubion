  /api/v1/transfers:
    get:
      operationId: listTransfers
      description: |-
        Transfers (truck loads, evening returns, moves between cold rooms), newest day first, paginated
        (`limit`, `offset`). Filter by kind, status, location (in or out), days (inclusive) or `search`
