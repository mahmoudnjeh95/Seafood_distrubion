      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverDay'
          description: ''
    post:
      operationId: openMyDay
      description: |-
        Accept the cash the office set for today and start the day with it (D-203), on the driver's truck of the
        day. Refused while the office has set nothing. One day per date: asking again returns it unchanged.
      tags:
      - my-day
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverDay'
          description: ''
  /api/v1/my-day-closing:
    post:
      operationId: closeMyDay
      description: |-
        Send the end of the day with an optional note: the day is closed until a load validated that date opens
        it again. The driver sees what they should hold; the office counts the cash (D-213). Sent again after the
        office asked for a justification, after such a load, or when the day's records changed since the send.
      tags:
      - my-day-closing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayClosingWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DayClosingWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DayClosingWrite'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyDaySummary'
          description: ''
  /api/v1/my-day-summary:
    get:
      operationId: getMyDaySummary
      description: |-
        The driver's day so far: sales, cash, expenses and the stock per product, and the closing if sent.
        404 until the day is started.
      tags:
      - my-day-summary
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyDaySummary'
          description: ''
  /api/v1/my-day/fund:
    get:
      operationId: getMyDayFund
      description: 'The cash the office set for the driver today, to accept before
        starting the day (D-203). 404: none yet.'
      tags:
      - my-day
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayFund'
          description: ''
  /api/v1/my-day/locations:
    post:
      operationId: recordMyLocations
      description: |-
        The GPS points of the driver's phone for today's day, up to 200 at a time (D-164). A resent point is
        stored once; points after the sent closing are dropped. 404 until the day is started.
      tags:
      - my-day
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationPingBatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LocationPingBatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LocationPingBatch'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationPingSaved'
          description: ''
  /api/v1/my-day/purchase-change:
    get:
      operationId: getMyPurchaseChange
      description: |-
        The money for purchases the office proposed on today's day, waiting for the driver's approval (D-260).
        404: nothing waits.
      tags:
      - my-day
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseFloatChange'
          description: ''
  /api/v1/my-day/purchase-change/approve:
    post:
      operationId: approveMyPurchaseChange
      description: |-
        The driver agrees on the phone to the money for purchases the office proposed (D-260): it takes effect at
        once. 404 before the day is started.
      tags:
      - my-day
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverDay'
          description: ''
  /api/v1/my-days:
    get:
      operationId: listMyDays
      description: The driver's own days, newest first (the last 60), each with its
