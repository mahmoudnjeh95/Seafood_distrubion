                  $ref: '#/components/schemas/LotFigure'
          description: ''
  /api/v1/lot-work-days:
    get:
      operationId: listLotWorkDays
      description: |-
        Days worked on lots, newest first, each with its cost (days × salary / 26). Filter by `employee`,
        `batch` or `month`.
      parameters:
      - in: query
        name: batch
        schema:
          type: integer
          minimum: 1
      - in: query
        name: employee
        schema:
          type: integer
          minimum: 1
      - in: query
        name: month
        schema:
          type: string
          format: date
      tags:
      - lot-work-days
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LotWorkDay'
          description: ''
    post:
      operationId: createLotWorkDay
      description: Record days an employee worked on a lot (a fraction of a day, at
        most 1 per employee and date).
