          type: boolean
          default: false
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - draft
          - posted
          - partly_paid
          - paid
          - open
          type: string
          minLength: 1
        description: |-
          * `draft` - draft
          * `posted` - posted
          * `partly_paid` - partly_paid
          * `paid` - paid
          * `open` - open
      - in: query
        name: supplier
        schema:
          type: integer
          minimum: 1
      tags:
      - supplier-invoices
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSupplierInvoiceList'
          description: ''
    post:
      operationId: createSupplierInvoice
      description: |-
        Record a supplier invoice for some of their receipts, as a draft, or posted at once with `post`.
        Its amount is the receipts' invoiced amount (invoiced kg × cost); a receipt goes on one invoice only.
      tags:
      - supplier-invoices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierInvoiceWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupplierInvoiceWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SupplierInvoiceWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierInvoice'
          description: ''
  /api/v1/supplier-invoices/{invoice_id}:
    get:
      operationId: getSupplierInvoice
      parameters:
      - in: path
        name: invoice_id
        schema:
          type: integer
        required: true
      tags:
      - supplier-invoices
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierInvoice'
          description: ''
    put:
      operationId: updateSupplierInvoice
      description: |-
        Change a draft invoice: receipts, dates, reference, notes; `post` posts it afterwards. A posted
        invoice no longer changes (400). The supplier does not change.
      parameters:
      - in: path
        name: invoice_id
        schema:
          type: integer
        required: true
      tags:
      - supplier-invoices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierInvoiceUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupplierInvoiceUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SupplierInvoiceUpdate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierInvoice'
          description: ''
    delete:
      operationId: deleteSupplierInvoice
      description: Delete a draft invoice; its receipts can go on another one. A posted
        invoice is never deleted (400).
      parameters:
      - in: path
        name: invoice_id
        schema:
          type: integer
        required: true
      tags:
      - supplier-invoices
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/supplier-invoices/{invoice_id}/plan:
    put:
      operationId: setSupplierInvoicePlan
      description: |-
        Replace the open plan lines of a posted invoice: how, when and how much will be paid (D-192). Their sum
        may not exceed what is left to pay. A plan is not a payment: the supplier balance does not move. Errors of a
        line come back on `lines.<index>.<field>`; an empty list clears the plan.
      parameters:
      - in: path
        name: invoice_id
        schema:
          type: integer
        required: true
      tags:
      - supplier-invoices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlanWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlanWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementRow'
          description: ''
  /api/v1/supplier-invoices/{invoice_id}/post:
    post:
      operationId: postSupplierInvoice
      description: 'Post a draft invoice: it is owed to the supplier, counts in their
        balance and can be paid. Final.'
