          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: kind
        schema:
          enum:
          - customer_payment
          - supplier_payment
          - effet_cashed
          - effet_unpaid
          - effet_debited
          - transfer
          - count_gap
          - sale_cash
          - driver_handover
          - driver_fund
          - expense
          - salary
          - partner_settlement
          - field_purchase
          type: string
          minLength: 1
        description: |-
          * `customer_payment` - Règlement client
          * `supplier_payment` - Règlement fournisseur
          * `effet_cashed` - Effet encaissé
          * `effet_unpaid` - Effet impayé
          * `effet_debited` - Effet débité
          * `transfer` - Mouvement entre comptes
          * `count_gap` - Écart de caisse
          * `sale_cash` - Vente au comptant
          * `driver_handover` - Remise du chauffeur
          * `driver_fund` - Fonds remis au chauffeur
          * `expense` - Dépense
          * `salary` - Salaire
          * `partner_settlement` - Règlement associé
          * `field_purchase` - Achat au port
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      tags:
      - treasury
      security:
      - cookieAuth: []
      responses:
