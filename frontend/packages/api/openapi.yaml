  /api/v1/purchase-orders:
    get:
      operationId: listPurchaseOrders
      description: |-
        Purchase orders (commandes d'achat), newest first, paginated, each with its lines (ordered, received
        and remaining weight) and its receipts. Filter by supplier, status (`pending` = still waiting for
        goods) or `search` (number, supplier's name).
      parameters:
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - open
          - partly_received
          - received
          - closed
          - cancelled
          - pending
          type: string
          minLength: 1
        description: |-
          * `open` - En attente
          * `partly_received` - Reçu en partie
          * `received` - Reçu
          * `closed` - Clôturé
          * `cancelled` - Annulé
          * `pending` - pending
      - in: query
        name: supplier
        schema:
          type: integer
          minimum: 1
      tags:
      - purchase-orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderList'
          description: ''
    post:
      operationId: createPurchaseOrder
      description: |-
        Record a purchase order: what we ask a supplier to deliver, at what price. It moves no stock;
        deliveries are goods receipts against it, as many as the supplier makes.
      tags:
      - purchase-orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/purchase-orders/{order_id}:
    get:
      operationId: getPurchaseOrder
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - purchase-orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/purchase-orders/{order_id}/cancel:
    post:
      operationId: cancelPurchaseOrder
      description: Cancel an order nothing was delivered against.
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - purchase-orders
      security:
      - cookieAuth: []
