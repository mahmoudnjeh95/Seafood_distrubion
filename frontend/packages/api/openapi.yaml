      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadReturn'
          description: ''
  /api/v1/my-stock:
    get:
      operationId: listMyStock
      description: |-
