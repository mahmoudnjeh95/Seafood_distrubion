[project]
name = "frutti-backend"
version = "0.1.0"
description = "Frutti Del Mare ERP backend (Django + DRF)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "gunicorn>=23",
    "django-stubs-ext>=6.1.2",
    "whitenoise>=6.12.0",
    "sentry-sdk>=2.71.0",
    "pillow>=12",
    "weasyprint>=70.0",
    "celery>=5.6.3",
    "redis>=8.1.0",
    "openpyxl>=3.1.5",
    "httpx>=0.28.1",
    "anthropic>=2.6.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "factory-boy>=3.3.3",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "blank_seller: the organization starts without an address or tax ID in its finance settings",
    "supplier_withholding: the organization starts with the real supplier withholding rate (1 %)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "UP",           # modern syntax
    "B",            # likely bugs
    "BLE",          # blind except
    "C4",           # comprehensions
    "DJ",           # Django
    "DTZ",          # naive datetimes
    "PT",           # pytest style
    "SIM",          # simplifications
    "T20",          # stray print
    "RUF",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # French and Arabic text is expected in strings and comments
    "RUF012",                      # Django Meta and admin options are plain class attributes
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "tooling"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_unreachable = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
# Tests stay readable without annotations on every fixture and test function.
module = ["*.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["environ.*", "grimp.*", "importlinter.*", "weasyprint.*", "celery.*", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# factory_boy re-exports its API from the package root without `__all__`.
module = ["factory", "factory.*"]
implicit_reexport = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.importlinter]
root_packages = ["apps"]
exclude_type_checking_imports = true
contract_types = ["app_boundaries: tooling.import_contracts.AppBoundariesContract"]

[[tool.importlinter.contracts]]
name = "Apps only use each other's services and selectors; core depends on no other app"
type = "app_boundaries"
