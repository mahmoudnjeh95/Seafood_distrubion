# Runs on pull requests and on pushes to main only (D-297); the browser tests (e2e) only on pull requests (D-157).
# A push to a task branch runs nothing: its pull request runs the same checks once, not twice. Locally: `make lint` and `make test` run the same checks.
# Actions are pinned to a commit (D-012); the comment gives the release it belongs to.
# The runner image is pinned as well: `ubuntu-latest` moves to Ubuntu 26 from 2026-10-19. Change it on purpose, on a branch.
name: CI

# A change that touches only docs (docs/ and Markdown files) runs no checks at all (D-157).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frutti
          POSTGRES_PASSWORD: frutti
          POSTGRES_DB: frutti
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U frutti -d frutti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://frutti:frutti@localhost:5432/frutti
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install Pango (WeasyPrint draws the PDFs with it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
        working-directory: .
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: App boundaries
        run: uv run lint-imports
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run pytest

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Type check
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  api-contract:
    name: Generated API client is up to date
    runs-on: ubuntu-24.04
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend dependencies
        run: uv sync --frozen
        working-directory: backend
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Write the OpenAPI schema
        run: uv run python manage.py spectacular --lang fr --validate --fail-on-warn --file ../frontend/packages/api/openapi.yaml
        working-directory: backend
      - name: Generate the client
        run: pnpm gen-api
        working-directory: frontend
      - name: Fail if the committed client differs (run `make gen-api` and commit)
        run: git diff --exit-code -- frontend/packages/api

  e2e:
    name: End-to-end (login in both apps)
    # Only on pull requests (opened, or new commits pushed to one): the slowest check, not needed on every push (D-157).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frutti
          POSTGRES_PASSWORD: frutti
          POSTGRES_DB: frutti
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U frutti -d frutti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://frutti:frutti@localhost:5432/frutti
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend dependencies
        run: uv sync --frozen
        working-directory: backend
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Install the test browser
        run: pnpm --filter @frutti/e2e exec playwright install --with-deps chromium
        working-directory: frontend
      # Playwright starts the backend (migrate + seed_dev) and both apps itself.
      - name: End-to-end tests
        run: pnpm e2e
        working-directory: frontend

  deploy-staging:
    name: Deploy to staging
    # Only after every check passed, only for main. Stays skipped until the secrets below exist.
    # No e2e here: it ran on the pull request before the merge (D-157).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, api-contract]
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
    steps:
      - name: Skip when the deploy secrets are not set
        id: secrets
        run: |
          if [ -z "$STAGING_SSH_KEY" ] || [ -z "$STAGING_KNOWN_HOSTS" ]; then
            echo "::notice::STAGING_SSH_KEY / STAGING_KNOWN_HOSTS not set: staging deploy skipped (see docs/runbook.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.ready == 'true'
      - name: Set up SSH
        if: steps.secrets.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging && chmod 600 ~/.ssh/staging
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: bash deploy/deploy.sh
        env:
          DEPLOY_SSH_OPTS: -i /home/runner/.ssh/staging -o IdentitiesOnly=yes -o BatchMode=yes
