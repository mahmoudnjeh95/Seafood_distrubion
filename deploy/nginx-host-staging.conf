# Host nginx site for Frutti Del Mare staging, installed as /etc/nginx/sites-available/frutti-staging by
# deploy/remote-deploy.sh. It only adds ports and names and never touches the other sites on this server.
# Each app has its own name on the company domain (D-155): browsers keep cookies per host name, so the
# owner's login on the admin app and the driver's login on the driver app never replace each other (D-036).
# HTTPS (phase 2, D-155): one Let's Encrypt certificate for both names, issued by certbot with the webroot
# method (docs/runbook.md, "Domain and HTTPS"). Port 80 only answers the challenge and redirects to https.
# The old sslip.io addresses (ports 8095 and 8096) redirect to the names.
# The public site (D-186) is www.fruttidelmare.com; the bare name redirects to it. The same certificate holds
# the four names: remote-deploy.sh adds www and the bare name to it the first time (webroot, port 80 below).

server {
    listen 8095;
    listen [::]:8095;
    server_name _;
    return 301 https://app.fruttidelmare.com$request_uri;
}

server {
    listen 8096;
    listen [::]:8096;
    server_name _;
    return 301 https://ch.fruttidelmare.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.fruttidelmare.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/frutti-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ch.fruttidelmare.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/frutti-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.fruttidelmare.com;

    ssl_certificate /etc/letsencrypt/live/frutti-staging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frutti-staging/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:18081; # admin app
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ch.fruttidelmare.com;

    ssl_certificate /etc/letsencrypt/live/frutti-staging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frutti-staging/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:18082; # driver app
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }
}

# ---- The public site (D-186) ----

server {
    listen 80;
    listen [::]:80;
    server_name www.fruttidelmare.com fruttidelmare.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/frutti-acme;
    }

    location / {
        return 301 https://www.fruttidelmare.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fruttidelmare.com;

    ssl_certificate /etc/letsencrypt/live/frutti-staging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frutti-staging/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.fruttidelmare.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.fruttidelmare.com;

    ssl_certificate /etc/letsencrypt/live/frutti-staging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frutti-staging/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:18083; # public site
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }
}

