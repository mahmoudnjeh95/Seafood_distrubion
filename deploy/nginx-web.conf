# nginx inside the "web" container. Port 8081 serves the admin app, 8082 the driver app, 8083 the public site;
# each sends the API to the backend. The host's nginx sits in front (deploy/nginx-host-staging.conf).

upstream frutti_backend {
    server backend:8000;
}

# The training copy's backend (D-290), looked up when asked (Docker's DNS), so this nginx starts even while it is down.
resolver 127.0.0.11 valid=10s ipv6=off;

# Keep the scheme set by the host's nginx (http on staging, https once a domain exists).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8081;
    root /srv/admin;
    set $frutti_api frutti_backend;
    include /etc/nginx/conf.d/frutti-app.inc;
}

server {
    listen 8082;
    root /srv/truck;
    set $frutti_api frutti_backend;
    include /etc/nginx/conf.d/frutti-app.inc;
}

# The training copy (D-290): the same apps, sent to the training backend and its own database.
server {
    listen 8091;
    root /srv/admin;
    set $frutti_api training-backend:8000;
    include /etc/nginx/conf.d/frutti-app.inc;
}

server {
    listen 8092;
    root /srv/truck;
    set $frutti_api training-backend:8000;
    include /etc/nginx/conf.d/frutti-app.inc;
}

# The public site (D-186): one page, its pictures and video, and the API it calls (catalogue and requests).
server {
    listen 8083;
    root /srv/site;
    set $frutti_api frutti_backend;
    include /etc/nginx/conf.d/frutti-app.inc;

    location /media/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
}
