# Training stack (D-283): the same application as compose.staging.yml, with its own database, media and Redis, so
# new employees practise without touching the company's data. Started by deploy/remote-deploy.sh with the images the
# production stack has just built (same release); emptied only by hand with ~/frutti-training/bin/reset-training.sh.
# Secrets come from ~/frutti-training/.env on the server. Nothing listens publicly: the host's nginx is the only way in.
# Kept apart from compose.staging.yml on purpose: merging two files would add the ports, not replace them.
name: frutti-training

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: frutti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: frutti
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frutti -d frutti"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: frutti-backend:${RELEASE:?set by the deploy script}
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && exec gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 2 --access-logfile - --no-control-socket"
    environment: &backend-env
      DATABASE_URL: postgres://frutti:${POSTGRES_PASSWORD}@db:5432/frutti
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set in .env}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?set in .env}
      DJANGO_SECURE_SSL_REDIRECT: "true"
      DJANGO_SECURE_COOKIES: "true"
      DJANGO_SECURE_HSTS_SECONDS: "300"
      DJANGO_NUM_PROXIES: "2"
      DJANGO_CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      # The training copy: "Formation" tag on screen, and the only place prepare_training runs.
      FRUTTI_TRAINING: "true"
      # No mailbox: the customers' addresses are real, so a training document is never e-mailed to them.
      EMAIL_HOST: ""
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: training
      SENTRY_RELEASE: ${RELEASE}
    volumes: [media:/app/media]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request as r; r.urlopen(r.Request('http://127.0.0.1:8000/api/v1/health', headers={'Host': os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0], 'X-Forwarded-Proto': 'https'}))"
      interval: 10s
      timeout: 5s
      retries: 12

  # The PDFs, as on production: they look exactly like the real ones (owner's choice, D-283).
  worker:
    image: frutti-backend:${RELEASE}
    restart: unless-stopped
    environment: *backend-env
    volumes: [media:/app/media]
    command: celery -A config worker --loglevel=INFO --concurrency=1
    depends_on:
      backend: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    image: frutti-web:${RELEASE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18091:8081" # admin app, app1.fruttidelmare.com
      - "127.0.0.1:18092:8082" # driver app, ch1.fruttidelmare.com
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
  media:
