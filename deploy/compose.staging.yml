# Staging stack on the OVH VPS, started by deploy/remote-deploy.sh. Secrets come from ~/frutti-staging/.env
# on the server, never from the repository. Nothing listens publicly: the host's nginx is the only way in.
name: frutti-staging

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: frutti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: frutti
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frutti -d frutti"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Broker of the background jobs (PDFs, D-071). Nothing is kept: a lost job is asked again by the screen.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: { context: .., target: backend }
    image: frutti-backend:${RELEASE:?set by the deploy script}
    restart: unless-stopped
    # backfill_treasury writes the treasury movements of older records once (D-219); safe on every start.
    command: sh -c "python manage.py migrate --noinput && (python manage.py backfill_treasury || true) && exec gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 3 --access-logfile - --no-control-socket"
    environment: &backend-env
      DATABASE_URL: postgres://frutti:${POSTGRES_PASSWORD}@db:5432/frutti
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set in .env}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?set in .env}
      # HTTPS on the company domain (D-155, phase 2). HSTS starts at 5 minutes; raise it to 30 days once the
      # phones have been checked (docs/runbook.md, Domain and HTTPS).
      DJANGO_SECURE_SSL_REDIRECT: "true"
      DJANGO_SECURE_COOKIES: "true"
      DJANGO_SECURE_HSTS_SECONDS: "300"
      # Host nginx, then the web container.
      DJANGO_NUM_PROXIES: "2"
      # Shared by the three server processes, so the login limits (D-023) count across all of them.
      DJANGO_CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      SENTRY_DSN: ${SENTRY_DSN:-}
      # The company mailbox documents are sent from (D-206); empty EMAIL_HOST: sending is refused with a message.
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-contact@fruttidelmare.com}
      SENTRY_ENVIRONMENT: staging
      SENTRY_RELEASE: ${RELEASE}
    volumes: [media:/app/media] # product photos and PDFs, served by the API to members only
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # Sends the public host name: Django refuses any Host not in DJANGO_ALLOWED_HOSTS.
      test:
        - CMD
        - python
        - -c
        # The https scheme is what the host nginx sends for the apps (D-155), so Django does not redirect the check.
        - "import os, urllib.request as r; r.urlopen(r.Request('http://127.0.0.1:8000/api/v1/health', headers={'Host': os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0], 'X-Forwarded-Proto': 'https'}))"
      interval: 10s
      timeout: 5s
      retries: 12

  # Runs the background jobs: the PDFs of quotes, invoices, credit notes and receipts. Same image, same media
  # volume as the API, which serves the finished files.
  worker:
    image: frutti-backend:${RELEASE}
    restart: unless-stopped
    environment: *backend-env
    volumes: [media:/app/media]
    command: celery -A config worker --loglevel=INFO --concurrency=2
    depends_on:
      backend: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: ..
      target: web
      # The apps report errors to Sentry only when SENTRY_DSN_FRONTEND is set in .env (D-140).
      args:
        SENTRY_DSN_FRONTEND: ${SENTRY_DSN_FRONTEND:-}
        SENTRY_ENVIRONMENT: staging
        RELEASE: ${RELEASE}
    image: frutti-web:${RELEASE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:8081" # admin app
      - "127.0.0.1:18082:8082" # driver app
      - "127.0.0.1:18083:8083" # public site (D-186); the host nginx gets a name for it once DNS exists
    depends_on:
      backend: { condition: service_healthy }

  # Nightly jobs, without touching the shared server's crontab. 03:00 UTC is 04:00 in Tunisia.
  nightly:
    image: frutti-backend:${RELEASE}
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      backend: { condition: service_healthy }
    # Sleeps until just after 03:00 UTC, then checks the stock on hand against the ledger (D-038). A
    # difference is logged as an error (Sentry once its DSN is set) and repaired by hand:
    # `docker compose ... exec backend python manage.py rebuild_on_hand`.
    # Then marks as expired the sent quotes whose validity date has passed (D-050).
    # Each check records its run, read by /api/v1/health/stock-check and the uptime workflow (D-140). It also
    # runs once at start, so a fresh deploy has a recent result instead of reading as "never".
    command:
      - sh
      - -c
      - |
        python manage.py rebuild_on_hand --check || true
        while true; do
          sleep $$(( (86400 + 3 * 3600 - $$(date +%s) % 86400) % 86400 + 60 ))
          python manage.py rebuild_on_hand --check || true
          python manage.py expire_quotes || true
        done

volumes:
  pgdata:
  media:
